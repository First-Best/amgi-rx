:root {
  --bg: #EEF2EE;          /* 옅은 세이지 바탕 */
  --surface: #FFFFFF;
  --surface-2: #F5F7F4;
  --ink: #142B27;
  --muted: #56655F;
  --line: #D5DED9;
  --brand: #0F3D38;       /* 표지 짙은 초록 */
  --brand-ink: #F6F1E4;   /* 표지 크림 */
  --brand-soft: #C3D6CE;  /* 표지 민트 */
  --brand-mute: #8FB0A5;
  --accent: #FF9466;      /* 표지 주홍 */
  --accent-ink: #9C3D14;  /* 밝은 바탕 위 주홍 글자 */
  --accent-soft: #FFE6DA;
  --primary: #0F3D38;
  --primary-ink: #F6F1E4;
  --ok: #24724F; --ok-soft: #DCEFE4;
  --warn: #8A5A00; --warn-soft: #FBEFD3;
  --bad: #B03A2E; --bad-soft: #F8DFDB;
  --shadow: 0 1px 2px rgba(15,61,56,.06), 0 4px 16px rgba(15,61,56,.06);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --display: "AmgiDisplay", "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1C19; --surface: #112925; --surface-2: #0E2420; --ink: #E6EFEB; --muted: #9DB2AA;
    --line: #23413B; --brand: #0F3D38; --brand-ink: #F6F1E4; --brand-soft: #C3D6CE; --brand-mute: #8FB0A5;
    --accent: #FF9466; --accent-ink: #FFB592; --accent-soft: #3A2419;
    --primary: #C3D6CE; --primary-ink: #0B2421;
    --ok: #7FD1A4; --ok-soft: #173A2B; --warn: #F1C46B; --warn-soft: #3A2F12; --bad: #F19A8F; --bad-soft: #3D1D19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1C19; --surface: #112925; --surface-2: #0E2420; --ink: #E6EFEB; --muted: #9DB2AA;
  --line: #23413B; --brand: #0F3D38; --brand-ink: #F6F1E4; --brand-soft: #C3D6CE; --brand-mute: #8FB0A5;
  --accent: #FF9466; --accent-ink: #FFB592; --accent-soft: #3A2419;
  --primary: #C3D6CE; --primary-ink: #0B2421;
  --ok: #7FD1A4; --ok-soft: #173A2B; --warn: #F1C46B; --warn-soft: #3A2F12; --bad: #F19A8F; --bad-soft: #3D1D19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Claude 미리보기 페이지의 기본 틀과 똑같이, 휴대폰 위아래 안전 구역만큼 문서를 띄운다 (앱 주소에서도 같은 모양) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
html.is-welcome body { background: var(--brand); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.55;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
p { margin: 0; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; position: relative; }

/* ---------- 위 띠 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
}
.top-in {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 56px;
}
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; min-width: 0; }
.wm { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; white-space: nowrap; }
.wm b { color: var(--accent); font-weight: 900; }
.wm-sub { font-size: 12px; color: var(--brand-soft); letter-spacing: .04em; white-space: nowrap; }
.dday { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; text-decoration: none; }
.dday-n { font-family: var(--display); font-weight: 900; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dday-l { font-size: 11.5px; color: var(--brand-soft); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 본문 ---------- */
.view {
  padding-top: 18px; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.view.no-nav { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.01em; }
.h2 { font-size: 18px; font-weight: 800; }
.h3 { font-size: 15.5px; font-weight: 800; }
.sub { color: var(--muted); font-size: 14.5px; }
.small { font-size: 13.5px; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--accent-ink); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.center { text-align: center; }
.num { font-variant-numeric: tabular-nums; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; }
.card.soft { background: var(--surface-2); box-shadow: none; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* ---------- 버튼 ---------- */
.btn {
  appearance: none; border: 1px solid transparent; border-radius: 12px; cursor: pointer;
  min-height: 44px; padding: 10px 16px; font-weight: 700; font-size: 15.5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center;
  background: var(--surface-2); color: var(--ink); border-color: var(--line);
  transition: transform .06s ease, background-color .15s ease;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn-accent { background: var(--accent); color: #2B1408; border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-text { background: transparent; border-color: transparent; color: var(--accent-ink); padding-inline: 8px; min-height: 40px; }
.btn-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn-block { width: 100%; }
.btn-lg { min-height: 54px; font-size: 17px; border-radius: 14px; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- 칩과 상태 ---------- */
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.pill-today { background: var(--accent-soft); color: var(--accent-ink); }
.pill-late { background: var(--bad-soft); color: var(--bad); }
.pill-done { background: var(--ok-soft); color: var(--ok); }
.pill-next { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill-skip { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.star { color: var(--accent-ink); font-weight: 900; }

/* ---------- 배너 ---------- */
.banner { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; }
.banner .grow { display: flex; flex-direction: column; gap: 6px; }
.banner-info { background: var(--surface-2); border: 1px solid var(--line); }
.banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-warn b, .banner-info b { color: var(--ink); }
.banner-accent { background: var(--accent-soft); color: var(--accent-ink); }
.banner .x { background: none; border: 0; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 4px; min-height: 0; }

/* ---------- 오늘의 처방 목록 ---------- */
.rx-list { display: flex; flex-direction: column; gap: 10px; }
.rx {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
}
.rx.late { border-left: 4px solid var(--bad); }
.rx.today { border-left: 4px solid var(--accent); }
.rx-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rx-title { font-weight: 800; font-size: 16.5px; }
.rx-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }

.empty { text-align: center; padding: 22px 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty .big { font-family: var(--display); font-weight: 900; font-size: 30px; color: var(--brand-mute); }

/* ---------- 7일 예보 ---------- */
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; padding-top: 6px; }

.bar.zero i { background: var(--line); }
.bar .v { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .d { font-size: 12px; color: var(--muted); }
.bar.is-today .d { color: var(--ink); font-weight: 800; }
.budget-line { font-size: 12.5px; color: var(--muted); }

/* ---------- 목록 ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; min-height: 52px; }
.li:first-child { border-top: 0; }
.li .grow { display: flex; flex-direction: column; gap: 2px; }
.li .t { font-weight: 700; }
.li .s { font-size: 13.5px; color: var(--muted); }
.li .chev { color: var(--muted); font-size: 18px; }
.group-h { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; padding: 4px 2px; }

.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--ok); }
.dots i.due { background: var(--accent); }
.dots i.late { background: var(--bad); }
.dots i.skip { background: transparent; border: 1px dashed var(--line); }

/* ---------- 단원 타임라인 ---------- */
.tl { display: flex; flex-direction: column; gap: 0; }
.tl-i { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; position: relative; }
.tl-i::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-i:first-child::before { top: 18px; }
.tl-i:last-child::before { bottom: calc(100% - 18px); }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; z-index: 1; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.tl-i.done .tl-dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tl-i.due .tl-dot { border-color: var(--accent); background: var(--accent-soft); }
.tl-i.late .tl-dot { border-color: var(--bad); background: var(--bad-soft); }
.tl-i .grow { display: flex; flex-direction: column; gap: 2px; }
.tl-i .t { font-weight: 700; }

  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 16px;
}

.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--brand); flex: none; }
.hint { font-size: 13.5px; color: var(--muted); }
.err { font-size: 13.5px; color: var(--bad); font-weight: 700; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; font-size: 14.5px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 800; cursor: pointer; }
.stepper input { width: 90px; text-align: center; font-family: var(--display); font-weight: 900; font-size: 30px; min-height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }

.plan { background: var(--surface-2); border: 1px dashed var(--brand-mute); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.plan-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.plan-row b { color: var(--accent-ink); }
.plan-row.skip span { color: var(--muted); text-decoration: line-through; }

/* ---------- 탭 막대 ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #2B1408; font-size: 11px; font-weight: 900; display: grid; place-items: center; padding: 0 4px; }

/* ---------- 아래에서 올라오는 창 ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(5,20,18,.45); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;

}

  display: flex; flex-direction: column; gap: 14px;
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }

.session { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }

.session-top-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.session-top .icon-btn { background: rgba(255,255,255,.1); color: var(--brand-ink); }
.session-title { text-align: center; min-width: 0; }
.session-title .t { font-weight: 800; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-title .s { font-size: 12px; color: var(--brand-soft); }
.steps { display: flex; gap: 6px; justify-content: center; padding-bottom: 10px; }
.steps i { width: 26px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); }
.steps i.on { background: var(--accent); }
.session-body { max-width: 560px; margin: 0 auto; padding-top: 20px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.step-no { font-size: 12.5px; font-weight: 800; color: var(--accent-ink); letter-spacing: .05em; }
.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }

.timer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.timer-n { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.timer-bar { width: 100%; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.timer-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s linear; }
.timer-note { font-size: 14px; color: var(--muted); min-height: 1.5em; text-align: center; }
.timer.hold .timer-note { color: var(--accent-ink); font-weight: 700; }
.timer.done .timer-n { color: var(--ok); }

.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 280px; box-shadow: var(--shadow); }
.flash-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
.flash-q { font-size: 21px; font-weight: 800; line-height: 1.45; white-space: pre-wrap; }
.flash-a { font-size: 18.5px; line-height: 1.5; padding: 14px; border-radius: 12px; background: var(--ok-soft); white-space: pre-wrap; }
.flash-gap { flex: 1; }
.need { display: inline-flex; gap: 4px; }
.need i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--brand-mute); }
.need i.on { background: var(--ok); border-color: var(--ok); }

.rate { display: flex; flex-direction: column; gap: 10px; }
.rate button { text-align: left; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 64px; }
.rate button b { font-size: 16.5px; }
.rate button span { font-size: 13.5px; color: var(--muted); }
.rate button.r-easy { border-left: 5px solid var(--ok); }
.rate button.r-ok { border-left: 5px solid var(--brand-mute); }
.rate button.r-hard { border-left: 5px solid var(--accent); }
.rate button.r-blank { border-left: 5px solid var(--bad); }

.big-done { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 12px 0; }
.big-done .mark { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: 32px; font-weight: 900; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; }

.cal-h { display: flex; align-items: center; justify-content: space-between; }

.day.out { opacity: .35; }
.day.is-today { border-color: var(--accent); }
.day.sel { outline: 2px solid var(--brand); outline-offset: -2px; }
.day.final { background: var(--accent-soft); }
.day.exam { background: var(--brand); color: var(--brand-ink); }
.day .n { font-weight: 700; }
.day .c { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 0 5px; background: var(--brand-soft); color: #0F3D38; }
.day .c.late { background: var(--bad-soft); color: var(--bad); }
.day .c.done { background: var(--ok-soft); color: var(--ok); }
.day .ex { font-size: 10.5px; font-weight: 900; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* ---------- 표 ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
.tbl th { font-size: 12.5px; color: var(--muted); font-weight: 800; }
.tbl td:nth-child(-n+3), .tbl th { white-space: nowrap; }
@media (max-width: 360px) { .tbl th, .tbl td { padding: 8px 4px; } table.tbl { font-size: 13.5px; } }

/* ---------- 알림 줄(토스트) ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14.5px; font-weight: 700; max-width: min(92vw, 520px); box-shadow: 0 6px 20px rgba(0,0,0,.25); text-align: center; }

/* ---------- 처음 화면 ---------- */
.welcome { min-height: 100%; background: var(--brand); color: var(--brand-ink); display: flex; flex-direction: column; }
.welcome-in { max-width: 560px; margin: 0 auto; width: 100%; padding-top: 36px; padding-bottom: 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; flex: 1; }
.welcome .eyebrow { color: #FFA07E; }
.welcome h1 { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: 1.12; letter-spacing: -0.02em; }
.welcome h1 b { color: var(--accent); font-weight: 900; }
.welcome .lead { color: var(--brand-soft); font-size: 16.5px; }
.welcome .lead b { color: var(--brand-ink); }
.motif { display: flex; flex-direction: column; gap: 8px; }
.motif .lab { font-size: 12.5px; color: var(--brand-mute); font-weight: 700; }
.motif .mrow { display: grid; grid-template-columns: 1fr 44px; gap: 10px; align-items: center; font-size: 14px; }
.motif .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; }

.welcome .points { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.welcome .points li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 15.5px; }
.welcome .points li span { font-family: var(--display); font-weight: 900; color: var(--accent); font-size: 17px; }
.welcome .btn-primary { background: var(--accent); color: #2B1408; border-color: var(--accent); }
.welcome .btn-ghost { color: var(--brand-ink); border-color: rgba(246,241,228,.35); }
.welcome .card { background: var(--surface); color: var(--ink); }
.welcome .by { font-size: 12.5px; color: var(--brand-mute); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (min-width: 600px) {
  .app { box-shadow: 0 0 0 1px var(--line); min-height: 100vh; background: var(--bg); }
}

<script>
/* 암기 처방전 복습 앱 — 복습 날짜 계산 엔진
 * 책 「암기 처방전」 5장 "남은 날로 정하는 복습 간격표"와
 * 부록 엑셀 "복습 날짜 계산기"(간격표 시트)의 규칙을 그대로 옮겼다.
 * 날짜는 모두 'YYYY-MM-DD' 문자열(기기 현지 날짜)로 다룬다.
 * 이 파일은 브라우저(window.AmgiEngine)와 Node(require) 양쪽에서 쓴다.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // min: 처음 공부한 날부터 시험까지 남은 날이 이 값 이상이면 이 줄 (계산기 B열)
  // r1, r2: 첫 공부 뒤 며칠 (C, D열) / r3: 첫 공부 뒤 며칠, 0이면 시험 며칠 전 기준만 (E열)

  var ROWS = [
    { id: '2w', label: '2주', min: 1, r1: 3, r2: 7, r3: 0, r3Before: 1, text: '3일 뒤 · 7일 뒤 · 시험 전날' },
    { id: '1m', label: '1개월', min: 22, r1: 7, r2: 14, r3: 0, r3Before: 3, text: '1주 뒤 · 2주 뒤 · 시험 3일 전' },
    { id: '3m', label: '3개월', min: 61, r1: 14, r2: 35, r3: 63, r3Before: 3, text: '2주 뒤 · 5주 뒤 · 9주 뒤' },
    { id: '6m', label: '6개월', min: 136, r1: 21, r2: 60, r3: 120, r3Before: 3, text: '3주 뒤 · 2개월 뒤 · 4개월 뒤' },
    { id: '1y', label: '1년', min: 271, r1: 30, r2: 90, r3: 210, r3Before: 3, text: '1개월 뒤 · 3개월 뒤 · 7개월 뒤' }

  // 복습 날 "얼마나 떠올랐나요"에 따른 다음 간격 배수.
  // 책 5장 "복습이 밀렸을 때": 술술 나오면 늘리고, 3분의 1도 안 나오면 줄이고,
  // 거의 아무것도 안 떠오르면 첫 공부로 돌아가요. 배수(1.5, 0.7)는 책에 숫자가 없어 앱이 정한 값.
  var FACTORS = { easy: 1.5, ok: 1, hard: 0.7 };

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function diffDays(a, b) { return Math.round((toUTC(a) - toUTC(b)) / 86400000); } // a - b

  function rowById(id) {
    for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) return ROWS[i];
    return null;
  }
  // 계산기 M열: MATCH(남은 날, 간격표 B5:B9, 1)
  function pickRow(daysLeft) {
    if (!(daysLeft >= 1)) return null;
    var row = ROWS[0];
    for (var i = 0; i < ROWS.length; i++) if (daysLeft >= ROWS[i].min) row = ROWS[i];
    return row;
  }
  function plannedOffset(row, j) {
    if (j === 0) return 0;
    if (j === 1) return row.r1;
    if (j === 2) return row.r2;
    return row.r3 || null; // 0이면 시험 기준으로 고정된 3차
  }

  /* fromK(0 = 첫 공부, 1~3 = n차 복습)를 날짜 D에 마쳤을 때, 그 뒤 복습 날짜를 다시 잡는다.
   * factor는 바로 다음 간격 하나에만 곱한다. 그다음 간격은 간격표의 계획 간격을 그대로 쓴다.
   * 건너뛰는 규칙은 계산기와 같다.
   *   1·2차: 날짜가 시험 날짜와 같거나 그 뒤면 건너뜀 (계산기 E·F열)
   *   3차: min(앞 복습 + 계획 간격, 시험 r3Before일 전). 앞 복습 날짜와 같거나 그 앞이면 건너뜀 (G·N열)
   * 반환: [fromK+1차 날짜, ..., 3차 날짜] (건너뛰면 null)
   */
  function chain(row, exam, fromK, D, factor) {
    var out = [];
    var prevDate = D;
    var prevOff = plannedOffset(row, fromK);
    if (prevOff === null) prevOff = 0;
    for (var j = fromK + 1; j <= 3; j++) {
      var anchored = (j === 3 && !row.r3);
      var cand;
      if (anchored) {
        cand = addDays(exam, -row.r3Before);
      } else {
        var gap = plannedOffset(row, j) - prevOff;
        if (j === fromK + 1 && factor && factor !== 1) gap = Math.max(1, Math.round(gap * factor));
        cand = addDays(prevDate, gap);
        if (j === 3) cand = minD(cand, addDays(exam, -row.r3Before));
      }
      var ok = (j < 3) ? (cand < exam && cand > prevDate) : (cand > prevDate && cand < exam);
      if (ok) {
        out.push(cand);
        prevDate = cand;
        if (!anchored) prevOff = plannedOffset(row, j);
      } else {
        out.push(null);
      }
    }
    return out;
  }

  // 첫 공부 날짜와 시험 날짜로 처음 계획을 세운다 (계산기 한 줄과 같은 결과).
  function planFrom(first, exam) {
    if (!isDate(first) || !isDate(exam)) return { ok: false, reason: 'date' };
    var days = diffDays(exam, first);
    var row = pickRow(days);
    if (!row) return { ok: false, reason: 'exam-not-after-first', days: days };
    var reviews = chain(row, exam, 0, first, 1);
    return { ok: true, row: row.id, days: days, reviews: reviews, finalStart: finalStartFor(first, exam) };
  }

  // 계산기 H열: 시험 14일 전이 첫 공부보다 뒤면 그날부터 총복습, 아니면 해당 없음
  function finalStartFor(first, exam) {
    var s = addDays(exam, -FINAL_DAYS);
    return s > first ? s : null;
  }

  // ---- 단원(unit) 상태를 다루는 함수 ----
  function newReviews(dates) {
    return dates.map(function (d) { return { due: d, done: null, rating: null, manual: false }; });
  }

  function nextPending(unit) {
    for (var j = 1; j <= 3; j++) {
      var r = unit.reviews[j - 1];
      if (r && r.due && !r.done) return j;
    }
    return 0;
  }
  function lastDone(unit) {
    var k = 0, d = unit.first;
    for (var j = 1; j <= 3; j++) {
      var r = unit.reviews[j - 1];
      if (r && r.done) { k = j; d = r.done; }
    }
    return { k: k, date: d };
  }

  // 복습 k를 날짜 D에 마쳤을 때 (rating: easy | ok | hard | blank)
  function completeReview(unit, k, D, rating, exam) {
    var r = unit.reviews[k - 1];
    r.done = D; r.rating = rating; r.manual = false;
    if (rating === 'blank') { restart(unit, D, exam); return { restarted: true }; }
    unit.lastFactor = FACTORS[rating] || 1;
    var row = rowById(unit.row);
    var next = chain(row, exam, k, D, unit.lastFactor);
    for (var j = k + 1; j <= 3; j++) {
      unit.reviews[j - 1] = { due: next[j - k - 1], done: null, rating: null, manual: false };
    }
    return { restarted: false };
  }

  // 첫 공부로 돌아가기: 오늘을 새 첫 공부 날로 보고 간격표를 다시 고른다.
  function restart(unit, D, exam) {
    unit.restarts = (unit.restarts || 0) + 1;
    unit.first = D;
    var p = planFrom(D, exam);
    unit.row = p.ok ? p.row : unit.row;
    unit.reviews = newReviews(p.ok ? p.reviews : [null, null, null]);
    unit.lastFactor = 1;
    unit.finalDone = null;
    unit.invalid = !p.ok;
  }

  // 복습 날짜를 직접 옮기기 (밀리거나 당길 때). 그 뒤 복습은 옮긴 날에 마친다고 보고 다시 잡는다.
  function moveReview(unit, k, newDate, exam) {
    unit.reviews[k - 1].due = newDate;
    unit.reviews[k - 1].manual = true;
    var row = rowById(unit.row);
    var next = chain(row, exam, k, newDate, 1);
    for (var j = k + 1; j <= 3; j++) {
      unit.reviews[j - 1] = { due: next[j - k - 1], done: null, rating: null, manual: false };
    }
  }

  // 시험 날짜가 바뀌었을 때: 줄을 다시 고르고, 마친 복습은 두고 남은 복습만 다시 잡는다.
  function recompute(unit, exam) {
    var days = diffDays(exam, unit.first);
    var row = pickRow(days);
    if (!row) {
      unit.invalid = true;
      for (var j0 = 1; j0 <= 3; j0++) {
        var r0 = unit.reviews[j0 - 1];
        if (!r0.done) unit.reviews[j0 - 1] = { due: null, done: null, rating: null, manual: false };
      }
      return;
    }
    unit.invalid = false;
    unit.row = row.id;
    var ld = lastDone(unit);
    var factor = ld.k === 0 ? 1 : (unit.lastFactor || 1);
    var next = chain(row, exam, ld.k, ld.date, factor);
    for (var j = ld.k + 1; j <= 3; j++) {
      unit.reviews[j - 1] = { due: next[j - ld.k - 1], done: null, rating: null, manual: false };
    }
  }

  return {
    ROWS: ROWS, FINAL_DAYS: FINAL_DAYS, FACTORS: FACTORS,
    addDays: addDays, diffDays: diffDays, isDate: isDate, toUTC: toUTC, fromUTC: fromUTC,
    rowById: rowById, pickRow: pickRow, chain: chain, planFrom: planFrom, finalStartFor: finalStartFor,
    newReviews: newReviews, nextPending: nextPending, lastDone: lastDone,
    completeReview: completeReview, restart: restart, moveReview: moveReview, recompute: recompute
  };
});

  function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  function fold(line) {
    var enc = new TextEncoder(), parts = [], cur = '', n = 0, limit = 75;
    Array.from(line).forEach(function (ch) {
      var b = enc.encode(ch).length;
      if (n + b > limit) { parts.push(cur); cur = ''; n = 0; limit = 74; }
      cur += ch; n += b;
    });
    parts.push(cur);
    return parts.join('\r\n ');
  }
  function stampUTC() {

    if (o.rrule) L.push('RRULE:' + o.rrule);

  var calMonth = null, calSel = null;
  function calendarView() {
    var T = today();
    if (!calMonth) calMonth = T.slice(0, 7);
    if (!calSel) calSel = T;
    var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7);
    var first = calMonth + '-01';
    var start = E.addDays(first, -wd(first));
    var ex = examDate(), fin = ex ? E.addDays(ex, -E.FINAL_DAYS) : null;
    var cells = WD.map(function (w, i) { return '<div class="wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) {
      var d = E.addDays(start, i);
      if (i >= 35 && d.slice(0, 7) !== calMonth) break;
      var pend = pendingOn(d).length;
      var late = 0;
      if (d === T) late = dueItems().filter(function (x) { return x.late > 0; }).length;
      var done = doneOn(d).filter(function (x) { return x.h.type === 'review' || x.h.type === 'extra' || x.h.type === 'final'; }).length;
      var cls = 'day' + (d.slice(0, 7) !== calMonth ? ' out' : '') + (d === T ? ' is-today' : '') + (d === calSel ? ' sel' : '') + (ex && d === ex ? ' exam' : (fin && d >= fin && d < ex ? ' final' : ''));
      var badge = '';
      if (ex && d === ex) badge = '<span class="ex">시험</span>';
      else if (d < T && done) badge = '<span class="c done">' + done + '</span>';
      else if (pend || late) badge = '<span class="c' + (late ? ' late' : '') + '">' + (pend + late) + '</span>';
      cells += '<button class="' + cls + '" data-act="cal-day" data-d="' + d + '" aria-label="' + esc(mdw(d)) + (pend ? ' 복습 ' + pend + '개' : '') + '"><span class="n">' + (+d.slice(8)) + '</span>' + badge + '</button>';
    }
    var sel = calSel;
    var pendSel = sel === T ? dueItems().map(function (x) { return { u: x.u, k: x.k }; }) : pendingOn(sel);
    var doneSel = doneOn(sel);
    var selHtml = '<section class="stack"><h2 class="h3">' + esc(mdw(sel)) + (sel === T ? ' · 오늘' : '') + '</h2>';
    if (ex && sel === ex) selHtml += '<p><b>시험 날이에요.</b></p>';
    if (pendSel.length) selHtml += '<div class="list">' + pendSel.map(function (x) { return '<a class="li" href="#unit-' + x.u.id + '"><div class="grow"><span class="t">' + esc(x.u.name) + '</span><span class="s">' + x.k + '차 복습' + (x.u.subject ? ' · ' + esc(x.u.subject) : '') + '</span></div><span class="chev">›</span></a>'; }).join('') + '</div>';
    if (doneSel.length) selHtml += '<div class="list">' + doneSel.map(function (x) {
      var lbl = x.h.type === 'first' ? '첫 공부' : x.h.type === 'review' ? x.h.k + '차 복습 마침' : x.h.type === 'final' ? '총복습' : '한 번 더 꺼내기';
      return '<a class="li" href="#unit-' + x.u.id + '"><div class="grow"><span class="t">' + esc(x.u.name) + '</span><span class="s">' + lbl + (typeof x.h.holes === 'number' ? ' · 구멍 ' + x.h.holes : '') + '</span></div><span class="pill pill-done">✓</span></a>';
    }).join('') + '</div>';
    if (!pendSel.length && !doneSel.length && !(ex && sel === ex)) selHtml += '<p class="small">이날 잡힌 복습이 없어요.</p>';
    selHtml += '</section>';
    return '<section class="stack"><h1 class="h1">달력</h1></section>' +
      '<section class="card"><div class="cal-h"><button class="icon-btn" data-act="cal-prev" aria-label="지난달">‹</button><h2 class="h3 num">' + y + '년 ' + m + '월</h2><button class="icon-btn" data-act="cal-next" aria-label="다음 달">›</button></div>' +
      '<div class="cal">' + cells + '</div>' +
      '<div class="legend"><span><i style="background:var(--brand-soft)"></i>잡힌 복습</span><span><i style="background:var(--bad-soft)"></i>밀린 복습</span><span><i style="background:var(--ok-soft)"></i>마친 복습</span><span><i style="background:var(--accent-soft)"></i>총복습 기간</span></div>' +
      (calMonth !== T.slice(0, 7) ? '<button class="btn btn-sm btn-ghost" data-act="cal-today">이번 달로</button>' : '') +
      '</section>' + selHtml;
  }

  function groupCount(ans, gid) { var c = 0; DIAG.forEach(function (q, i) { if (q[0].charAt(0) === gid && ans[i]) c++; }); return c; }
  function diagResult(d) {
    var hits = DIAG_GROUPS.filter(function (g) { return groupCount(d.answers, g.id) >= 2; });
    var order = ['가', '나', '마', '다', '라'];
    hits.sort(function (a, b) { return order.indexOf(a.id) - order.indexOf(b.id); });
    var html = '<section class="card" id="diag-result"><div class="eyebrow">' + esc(ymd(d.date)) + ' 결과</div>';
    if (!hits.length) return html + '<h2 class="h2">"예"가 두 개 이상인 묶음이 없어요</h2><p>지금 방법을 이어 가세요. 4주 뒤에 한 번 더 해 보세요.</p></section>';
    html += '<h2 class="h2">새는 자리 ' + hits.length + '곳</h2>' + hits.map(function (g) {
      return '<div class="stack" style="gap:4px"><b>' + g.id + ' 묶음 · ' + esc(g.name) + '</b><span class="small">' + esc(g.why) + '</span><span>먼저 읽을 처방: ' + esc(g.rx) + '</span><span class="small">앱에서는: ' + esc(g.app) + '</span></div>';
    }).join('<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">');
    if (hits.length > 1) html += '<p class="small">여러 곳이면 가, 나, 마 순서로 먼저 고치세요. 근거가 가장 튼튼한 처방이 그쪽에 있어요. (책 1장)</p>';
    return html + '</section>';
  }

    if (!wrongShowAll) list = list.filter(function (w) { return !w.redo; });

    var a = e.target.closest('[data-act]');
    if (!a) return;
    var act = a.getAttribute('data-act'), id = a.getAttribute('data-id');
    var u = id ? unitById(id) : null;
    switch (act) {
      case 'welcome-next': welcomeStep = 1; data = data || blank(); root.innerHTML = welcomeView(); afterWelcome(); break;
      case 'welcome-back': welcomeStep = 0; root.innerHTML = welcomeView(); afterWelcome(); break;
      case 'welcome-sample': loadSample(); welcomeStep = 0; go('today'); toast('예시를 불러왔어요. 둘러본 뒤 지우고 시작하세요.'); break;
      case 'exam-unknown':
        data = data || blank();
        data.exam = { name: $('#ex-name') ? $('#ex-name').value.trim() : '', date: E.addDays(today(), 90), provisional: true };
        save(); welcomeStep = 2; root.innerHTML = welcomeView(); afterWelcome(); break;
      case 'welcome-import':
        openSheet(sheetHead('쓰던 기록 불러오기') + '<p class="small">전에 쓰던 휴대폰의 더보기 › 백업과 기기 옮기기에서 만든 백업 파일이나 복사한 글자를 넣어요.</p>' + importFormHtml(), function (el) { bindImport(el); });
        break;
      case 'welcome-skip': data.meta.welcomeDone = true; save(); welcomeStep = 0; go('today'); break;
      case 'sample-clear':
        confirmSheet('예시를 지울까요?', '예시 단원과 카드, 오답을 모두 지우고 내 시험 날짜를 넣는 화면으로 가요.', '예시 지우기', function () {
          try { localStorage.removeItem(KEY); } catch (er) {}
          data = blank(); welcomeStep = 1; S = null; render();
        });
        break;
      case 'dismiss': data.meta.dismissed[a.getAttribute('data-key')] = 1; save(); render(); break;
      case 'open-external': location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href.split('#')[0]); break;
      case 'add-unit': addUnitSheet(); break;
      case 'sheet-close': closeSheet(); break;
      case 'start-review': if (u) startSession('review', u.id); break;
      case 'start-first': if (u) startSession('first', u.id); break;
      case 'start-extra': if (u) startSession('extra', u.id); break;
      case 'start-cards': if (u) startSession('cards', u.id); break;
      case 'drill-weak':
        var ids = wrongCards(+a.getAttribute('data-min') || 1).map(function (x) { return x.c.id; });
        if (!ids.length) { toast('틀린 적 있는 카드가 없어요'); break; }
        startSession('drill', null, { cardIds: ids }); break;
      case 'final-ok': if (u) { u.finalDone = today(); u.finalWeak = false; u.history.push({ date: today(), type: 'final', ok: true }); save(); render(); toast('떠올랐어요로 표시했어요'); } break;
      case 'final-weak': if (u) { u.finalDone = today(); u.finalWeak = true; u.history.push({ date: today(), type: 'final', ok: false }); save(); render(); toast('약한 단원으로 표시했어요. 한 번 더 꺼내 보세요.'); } break;
      case 'toggle-star': if (u) { u.star = !u.star; save(); render(); } break;
      case 'edit-unit': if (u) openSheet(sheetHead('단원 고치기') + unitFormHtml(u), function () { bindUnitForm(u); }); break;
      case 'delete-unit':
        if (u) confirmSheet('이 단원을 지울까요?', esc(u.name) + '의 복습 날짜와 카드 ' + u.cards.length + '장을 모두 지워요. 되돌릴 수 없어요.', '지우기', function () {
          data.units = data.units.filter(function (x) { return x.id !== u.id; });
          data.wrongs.forEach(function (w) { if (w.unitId === u.id) w.unitId = ''; });
          save(); go('units'); toast('단원을 지웠어요');
        }, true);
        break;
      case 'add-card': if (u) cardSheet(u, null); break;
      case 'edit-card': if (u) { var cid = a.getAttribute('data-card'); var c = u.cards.filter(function (x) { return x.id === cid; })[0]; if (c) cardSheet(u, c); } break;
      case 'move-review': if (u) moveSheet(u); break;
      case 'unit-ics':
        if (u) { var txt = unitICS(u); if (!txt) toast('달력에 넣을 앞으로의 복습이 없어요'); else if (download('amgi-review-' + u.id + '.ics', 'text/calendar;charset=utf-8', txt)) toast('달력 파일을 만들었어요. 열어서 추가를 눌러요.'); }
        break;
      case 'u-sub': unitFilter.subject = a.getAttribute('data-s'); render(); break;
      case 'cal-prev': case 'cal-next':
        var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7) + (act === 'cal-next' ? 1 : -1);
        if (m === 0) { m = 12; y--; } if (m === 13) { m = 1; y++; }
        calMonth = y + '-' + pad(m); render(); break;
      case 'cal-today': calMonth = today().slice(0, 7); calSel = today(); render(); break;
      case 'cal-day': daySheet(a.getAttribute('data-d')); break;
      case 'set-budget': data.settings.budget = +a.getAttribute('data-v'); save(); render(); break;
      case 'set-remind': data.settings.remind = a.getAttribute('data-v'); save(); render(); break;
      case 'daily-ics': if (download('amgi-daily-' + data.settings.remind.replace(':', '') + '.ics', 'text/calendar;charset=utf-8', dailyICS(data.settings.remind))) toast('달력 파일을 만들었어요. 열어서 추가를 눌러요.'); break;
      case 'export-file': download('amgi-backup-' + today() + '.json', 'application/json', JSON.stringify(data)) && toast('백업 파일을 저장했어요'); break;
      case 'export-copy': copyText(JSON.stringify(data), '백업 글자를 복사했어요. 안전한 곳에 붙여 넣어 두세요.'); break;
      case 'import-text': importData($('#import-text').value); break;
      case 'wipe':
        confirmSheet('모든 기록을 지울까요?', '단원, 카드, 오답, 진단 기록을 모두 지워요. 되돌릴 수 없어요. 먼저 백업을 권해요.', '모두 지우기', function () {
          try { localStorage.removeItem(KEY); } catch (er) {}
          data = blank(); welcomeStep = 0; S = null; location.hash = 'today'; render(); toast('모두 지웠어요');
        }, true);
        break;
      case 'install':
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; render(); }, function () {}); }
        break;
      case 'diag-done':
        var ans = DIAG.map(function (_, i) { var el = document.getElementById('dg-' + i); return !!(el && el.checked); });
        var T0 = today();
        data.diags = data.diags.filter(function (d) { return d.date !== T0; });
        data.diags.push({ date: T0, answers: ans });
        diagAns = null; save(); render();
        setTimeout(function () { var r = $('#diag-result'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
        break;
      case 'w-mark': wrongMark = a.getAttribute('data-v'); document.querySelectorAll('[data-act="w-mark"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === wrongMark)); }); var wt = $('#w-todo'); if (wt) wt.textContent = '할 일: ' + markTodo(wrongMark); break;
      case 'w-toggle': wrongShowAll = !wrongShowAll; render(); break;
      case 'wrong-redo':
        var w = data.wrongs.filter(function (x) { return x.id === a.getAttribute('data-w'); })[0];
        if (w) { w.redo = today(); save(); if (S) { a.outerHTML = '<span class="pill pill-done">다시 풂</span>'; } else render(); toast('다시 푼 날을 적었어요'); }
        break;
      case 'wrong-del':
        var wid = a.getAttribute('data-w');
        confirmSheet('이 오답을 지울까요?', '한 줄 기록을 지워요.', '지우기', function () { data.wrongs = data.wrongs.filter(function (x) { return x.id !== wid; }); save(); render(); }, true);
        break;
      // ----- 복습 진행 -----
      case 'sess-close': closeSession(false); break;
      case 'sess-next': nextStep(); break;
      case 'sess-finish': closeSession(true); break;
      case 'tmr-toggle': timerToggle(); break;
      case 'tmr-plus': S.timer.total += 60; if (S.timer.running) S.timer.base += 60; else S.timer.left += 60; S.timer.ended = false; paintTimer(); break;
      case 'tmr-set': if (!S.timer.started) { var mm = +a.getAttribute('data-v'); S.timer.total = mm * 60; S.timer.left = mm * 60; renderSession(); } break;
      case 'recall-done':
        var t = S.timer, el2 = t.total - timerLeft(t);
        if (t.started && !t.ended && el2 < 120 && !S.nudged) {
          S.nudged = true;
          var nd = $('#recall-nudge'); nd.textContent = '아직 2분이 안 됐어요. 떠올리려고 애쓰는 시간이 약효예요. 조금만 더 버텨 볼까요?'; nd.hidden = false;
          a.textContent = '그래도 넘어가기';
          break;
        }
        if (t.running) { t.left = timerLeft(t); t.running = false; releaseWake(); }
        S.timer = newTimer(0, Math.round(S.timer.total / 60));
        S.nudged = false;
        nextStep(); break;
      case 'paper-done': S.paperDone = true; nextStep(); break;
      case 'drill-reveal': S.drill.revealed = true; renderSession(); break;
      case 'drill-ans': drillAnswer(a.getAttribute('data-v') === '1'); renderSession(); break;
      case 'drill-skip-pause': S.drill.pause = 0; renderSession(); break;
      case 'drill-stop': S.drill.queue = []; nextStep(); break;
      case 'holes': var hi = $('#holes'); hi.value = Math.max(0, Math.min(999, (parseInt(hi.value, 10) || 0) + (+a.getAttribute('data-d')))); break;
      case 'check-again': S.holes += readHoles(); S.rounds++; S.i = 0; S.timer = newTimer(0, Math.round(S.timer.total / 60) || 5); S.drill = null; renderSession(); break;
      case 'check-done':
        if (S.type === 'first') S.holes += readHoles(); else S.holes = readHoles();
        S.drill = null;
        nextStep(); break;
      case 'rate': S.rating = a.getAttribute('data-v'); nextStep(); break;
    }
  }

  function importData(text) {
    var err = $('#import-err');
    function fail(m) { if (err) { err.textContent = m; err.hidden = false; } else toast(m); }
    var d;
    try { d = JSON.parse(String(text || '').trim()); } catch (e) { fail('백업 글자를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요.'); return; }
    d = normalize(d);
    if (!d || !d.exam) { fail('이 앱의 백업이 아니거나, 시험 날짜가 없는 백업이에요.'); return; }
    var cards = d.units.reduce(function (s, u) { return s + u.cards.length; }, 0);
    confirmSheet('백업을 불러올까요?', '단원 ' + d.units.length + '개, 카드 ' + cards + '장이 들어 있어요. 지금 기록은 이 백업으로 바뀌어요.', '불러오기', function () {
      data = d; save(); go('today'); toast('백업을 불러왔어요');
    });
  }

  // ================= 그리고 난 뒤 =================
  function afterRender(v) {
    if (v === 'units') {
      var s = $('#u-search');
      if (s) s.addEventListener('input', function () {
        unitFilter.q = s.value;
        var pos = s.selectionStart;
        render();
        var s2 = $('#u-search'); if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    if (v === 'exam') {
      $('#exam-edit').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = $('#ee-name').value.trim(), date = $('#ee-date').value, err = $('#ee-err');
        if (!E.isDate(date)) { err.textContent = '시험 날짜를 골라 주세요.'; err.hidden = false; return; }
        var changed = date !== data.exam.date;
        data.exam.name = name; data.exam.date = date;
        if (changed) { data.exam.provisional = false; data.units.forEach(function (u) { E.recompute(u, date); }); }
        save(); go('today'); toast(changed ? '복습 날짜를 새 시험 날짜에 맞춰 다시 잡았어요' : '저장했어요');
      });
    }
    if (v === 'remind') {
      var rt = $('#remind-time');
      if (rt) rt.addEventListener('change', function () { if (/^\d{2}:\d{2}$/.test(rt.value)) { data.settings.remind = rt.value; save(); render(); } });
    }
    if (v === 'backup') bindImport(document);
    if (v === 'more') {
      var sd = $('#set-sound');
      if (sd) sd.addEventListener('change', function () { data.settings.sound = sd.checked; save(); });
    }
    if (v === 'diag') {
      document.querySelectorAll('.dg').forEach(function (el) { el.addEventListener('change', function () { diagAns[+el.getAttribute('data-i')] = el.checked; }); });
    }
    if (v === 'wrongs') {
      $('#wrong-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var src = $('#w-src').value.trim(), why = $('#w-why').value.trim(), us = $('#w-unit');
        if (!src && !why) { toast('문제나 틀린 이유를 적어 주세요'); return; }
        data.wrongs.push({ id: uid(), date: today(), src: src, mark: wrongMark, why: why, unitId: us ? us.value : '', redo: null });
        save(); render(); toast('한 줄 적었어요. ' + markTodo(wrongMark));
      });
    }
    window.scrollTo(0, 0);
  }

  // ================= 앱 아이콘 숫자 =================
  function updateBadge() {
    try {
      if (!data || !data.exam || !navigator.setAppBadge) return;
      var n = dueItems().length;
      if (n) navigator.setAppBadge(n).catch(function () {}); else navigator.clearAppBadge().catch(function () {});
    } catch (e) {}
  }

  // ================= 시작 =================
  function boot() {
    root = document.getElementById('root');
    data = load();
    if (data && !data.exam) data = null;
    route = parseHash();
    if (route.name === 'session') { route = { name: 'today' }; try { history.replaceState(null, '', location.pathname + location.search + '#today'); } catch (e) {} }
    document.addEventListener('click', onClick);
    window.addEventListener('hashchange', function () {
      var nr = parseHash();
      if (S && nr.name !== 'session') {
        // 뒤로 가기로 복습 화면을 벗어나려 할 때
        clearInterval(tick); tick = null; releaseWake(); S = null; if (sessEl) { sessEl.remove(); sessEl = null; }
      }
      route = nr; render();
    });
    var lastDay = today();
    function dayCheck() { var t = today(); if (t !== lastDay) { lastDay = t; if (!S) render(); updateBadge(); } }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) dayCheck(); });
    setInterval(dayCheck, 60000);
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; if (route.name === 'install') render(); });
    window.addEventListener('appinstalled', function () { deferredPrompt = null; toast('설치했어요. 홈 화면의 아이콘으로 열어요.'); });
    render();
    updateBadge();
    if ('serviceWorker' in navigator && !IN_FRAME && /^https?:/.test(location.protocol) && CFG.sw !== false) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  }
  // 시험용 창구 (화면 시험 스크립트에서만 쓴다)
  window.AmgiApp = { get data() { return data; }, render: render, today: today, dailyICS: dailyICS, unitICS: unitICS, gcalDaily: gcalDaily };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
